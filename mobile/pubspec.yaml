name: sanipay_mobile
description: "SaniPay - Nigerian VTU, Airtime, Data, and Digital Bills Mobile Application"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter

  # Reactive State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Declarative Navigation & Deep Linking
  go_router: ^14.8.1

  # HTTP Networking
  dio: ^5.8.0+1

  # Encrypted Local Storage
  flutter_secure_storage: ^9.2.4

  # Local Biometrics
  local_auth: ^2.3.0

  # Formatting & Localization
  intl: ^0.19.0

  # UI, Icons & Fonts
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.17
  lucide_icons: ^0.363.0
  smooth_page_indicator: ^1.2.0+3
  pinput: ^5.0.1

  # Device & Share utilities
  share_plus: ^10.1.4
  url_launcher: ^6.3.1
  cached_network_image: ^3.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.15
  riverpod_generator: ^2.6.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/
