version: '3.8'

services:
  # Primary Relational Database
  postgres:
    image: postgres:16-alpine
    container_name: sanipay_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sanipay_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sanipay_password}
      POSTGRES_DB: ${POSTGRES_DB:-sanipay_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sanipay_user} -d ${POSTGRES_DB:-sanipay_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Cache & BullMQ Background Job Queue
  redis:
    image: redis:7-alpine
    container_name: sanipay_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # NestJS Backend REST API
  backend:
    build:
      context: ../backend
      dockerfile: ../docker/Dockerfile.backend
    container_name: sanipay_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: "postgresql://${POSTGRES_USER:-sanipay_user}:${POSTGRES_PASSWORD:-sanipay_password}@postgres:5432/${POSTGRES_DB:-sanipay_db}?schema=public"
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports:
      - "3000:3000"

  # Next.js Admin Dashboard
  admin:
    build:
      context: ../admin
      dockerfile: ../docker/Dockerfile.admin
    container_name: sanipay_admin
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NODE_ENV: production
      PORT: 3001
      NEXT_PUBLIC_API_URL: "${NEXT_PUBLIC_API_URL:-http://localhost:3000/api/v1}"
    ports:
      - "3001:3001"

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
